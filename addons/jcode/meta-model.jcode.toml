# HyperNexus — Meta model wiring for jcode (LEGACY / OPTIONAL custom profile).
# =============================================================================
# NOTE (2026-10-28): jcode SHIPS a built-in `meta-muse` provider that reads
# META_MUSE_API_KEY directly (`jcode auth status` confirms: "API key
# (`META_MUSE_API_KEY`)", runtime + tool validated). Prefer the built-in path:
#   .\use-meta-model.ps1 -Bridge "hello"   # mints + runs -p meta-muse
# This [providers.meta] snippet is kept ONLY for users who explicitly want a
# separately-named profile (e.g. side-by-side model defaults). It is NOT needed
# for the bridge. Auth is an ENV-VAR REFERENCE ONLY ("api_key_env") — this file
# never contains a token.

[providers.meta]
type = "open-ai-compatible"
base_url = "http://127.0.0.1:7778/v1"
auth = "bearer"
api_key_env = "META_MUSE_API_KEY"
default_model = "muse-spark-1.3-contributor"
requires_api_key = true
provider_routing = false
model_catalog = false

[[providers.meta.models]]
id = "muse-spark-1.3-contributor"
# context_window = 0   # optional: uncomment and set once Meta publishes it
