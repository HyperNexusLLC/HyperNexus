[project]
name = "hypernexus"
version = "1.0.0"
description = "HyperNexus control-plane skill for Prime Agent: memory, tool discovery, MCP bridge, sessions, knowledge graph."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hypernexus"]
