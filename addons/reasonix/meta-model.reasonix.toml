# HyperNexus — Meta model wiring for Reasonix (DROP-IN SNIPPET, no secrets inside).
# =============================================================================
# Model: muse-spark-1.3-contributor via Meta's OpenAI-compatible endpoint.
# Auth is an ENV-VAR REFERENCE ONLY ("api_key_env") — this file never contains
# a token. Set the variable in your own shell before launching.
#
# USER-RUN ACTIVATION (PowerShell — you type this, nothing is stored):
#   $env:META_MUSE_API_KEY = '<paste-your-token-here>'   # one live shell only
#   .\use-meta-model.ps1 "your prompt here"                # one-shot via run
#   .\use-meta-model.ps1                                   # interactive TUI
#   # ...or merge the [[providers]] block below into
#   # %APPDATA%\reasonix\config.toml, then pick the model in the TUI.
#
# To make it the default, also merge the top-level default_model key.

default_model = "meta/muse-spark-1.3-contributor"

[[providers]]
name        = "meta"
kind        = "openai"
# NOTE: Meta api rejects reasonix 'thinking' param -> keep disabled for this provider
base_url    = "https://api.meta.ai/v1"
models      = ["muse-spark-1.3-contributor"]
default     = "muse-spark-1.3-contributor"
api_key_env = "META_MUSE_API_KEY"
context_window = 1048576
vision_models = ["muse-spark-1.3-contributor"]
