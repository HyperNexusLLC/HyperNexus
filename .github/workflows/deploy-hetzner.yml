name: Deploy Hetzner

on:
  push:
    branches: [clean-main]
    paths:
      - "go/**"
      - "scripts/ci-deploy-hetzner.sh"
      - ".github/workflows/deploy-hetzner.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY != '' }}
      HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache-dependency-path: go/go.sum

      - name: Cross-compile Linux kernel
        working-directory: go
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -buildvcs=false -o ../bin/hypernexus-linux-amd64 ./cmd/tormentnexus/

      - name: Install SSH key
        if: env.HAS_SSH_KEY == 'true'
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.HETZNER_SSH_KEY }}
          known_hosts: ${{ secrets.HETZNER_KNOWN_HOSTS }}

      - name: Deploy binary and smoke test
        if: env.HAS_SSH_KEY == 'true'
        run: bash scripts/ci-deploy-hetzner.sh bin/hypernexus-linux-amd64

      - name: Skip notice
        if: env.HAS_SSH_KEY != 'true'
        run: echo "HETZNER_SSH_KEY secret not set; skipping deploy."
