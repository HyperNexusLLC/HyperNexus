# HyperNexus maki MCP configuration (copy to `<project>/.maki/mcp.toml`
# for project scope, or merge under `~/.config/maki/mcp.toml` globally).
# Port 7778 is authoritative. Port 8080 is stale — do not use it.
# Transport is stdio (`hypernexus.exe mcp`); HYPERNEXUS_WORKSPACE_ROOT
# scopes the kernel to this workspace, HYPERNEXUS_URL overrides the
# kernel base URL (default http://127.0.0.1:7778).
# Project MCP servers start only after the folder is trusted (`/trust`).

[mcp.hypernexus]
command = ["C:\\Users\\hyper\\workspace\\HyperNexus\\bin\\hypernexus.exe", "mcp"]
environment = { HYPERNEXUS_WORKSPACE_ROOT = "C:\\Users\\hyper\\workspace\\HyperNexus", HYPERNEXUS_URL = "http://127.0.0.1:7778" }
timeout = 10000
