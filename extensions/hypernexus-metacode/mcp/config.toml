# HyperNexus Meta Code MCP configuration (canonical TOML form).
# Port 7778 is authoritative. Port 8080 is stale — do not use it.
# Transport is stdio (`hypernexus.exe mcp`); HYPERNEXUS_WORKSPACE_ROOT
# scopes the kernel to this workspace, HYPERNEXUS_URL overrides the
# kernel base URL (default http://127.0.0.1:7778).

[mcp_servers.hypernexus]
command = "C:\\Users\\hyper\\workspace\\HyperNexus\\bin\\hypernexus.exe"
args = ["mcp"]

[mcp_servers.hypernexus.env]
HYPERNEXUS_WORKSPACE_ROOT = "C:\\Users\\hyper\\workspace\\HyperNexus"
HYPERNEXUS_URL = "http://127.0.0.1:7778"
